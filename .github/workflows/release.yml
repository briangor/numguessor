name: Build and Release NumGuessor

# =============================================================================
# TRIGGER
# Runs automatically when a version tag is pushed (e.g. v1.1.1, v2.0.0)
# Does NOT run on regular commits to main - only on tags
# =============================================================================
on:
  push:
    tags:
      - "v*.*.*"

jobs:

  # ===========================================================================
  # JOB 1 - BUILD WINDOWS INSTALLER (.exe)
  # Runs on a GitHub-hosted Windows machine
  # ===========================================================================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repo so the runner has access to the source code
      # -----------------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Install JDK 21 (includes jpackage)
      # -----------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # -----------------------------------------------------------------------
      # 3. Install WiX Toolset v3 (required by jpackage to build .exe)
      # -----------------------------------------------------------------------
      - name: Install WiX Toolset
        run: |
          curl -fsSL -o wix314.exe https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe
          Start-Process -FilePath wix314.exe -ArgumentList "/quiet" -Wait
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # -----------------------------------------------------------------------
      # 4. Compile the Java source code
      # -----------------------------------------------------------------------
      - name: Compile Java source
        run: javac src/NumGuessor.java -d out/

      # -----------------------------------------------------------------------
      # 5. Package compiled class into a runnable JAR
      # -----------------------------------------------------------------------
      - name: Create JAR
        run: jar cfe NumGuessor.jar NumGuessor -C out/ .

      # -----------------------------------------------------------------------
      # 6. Extract the version number from the tag (e.g. v1.1.1 → 1.1.1)
      # -----------------------------------------------------------------------
      - name: Extract version number
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      # -----------------------------------------------------------------------
      # 7. Build the Windows .exe installer using jpackage
      # -----------------------------------------------------------------------
      - name: Build Windows .exe
        run: |
          jpackage --input . `
                   --main-jar NumGuessor.jar `
                   --main-class NumGuessor `
                   --name NumGuessor `
                   --type exe `
                   --win-console `
                   --icon assets/icons/NumGuessor.ico `
                   --app-version ${{ steps.version.outputs.VERSION }} `
                   --vendor "0xb13" `
                   --description "A number guessing game" `
                   --copyright "Copyright 2026 0xb13" `
                   --win-shortcut `
                   --win-menu `
                   --win-menu-group "Games" `
                   --win-upgrade-uuid ${{ secrets.WIN_UPGRADE_UUID }}
        shell: pwsh

      # -----------------------------------------------------------------------
      # 8. Upload the .exe so the release job can attach it later
      # -----------------------------------------------------------------------
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NumGuessor-*.exe


  # ===========================================================================
  # JOB 2 - BUILD LINUX INSTALLER (.deb)
  # Runs on a GitHub-hosted Ubuntu machine
  # ===========================================================================
  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Compile Java source
        run: javac src/NumGuessor.java -d out/

      - name: Create JAR
        run: jar cfe NumGuessor.jar NumGuessor -C out/ .

      - name: Extract version number
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Linux .deb
        run: |
          jpackage --input .
                   --main-jar NumGuessor.jar
                   --main-class NumGuessor
                   --name NumGuessor
                   --type deb
                   --icon assets/icons/NumGuessor.png
                   --app-version ${{ steps.version.outputs.VERSION }}
                   --vendor "0xb13"
                   --description "A number guessing game"
                   --copyright "Copyright 2026 0xb13"
                   --linux-shortcut
                   --linux-menu-group "Games"
                   --linux-app-category "Game"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: NumGuessor_*.deb


  # ===========================================================================
  # JOB 3 - BUILD MACOS INSTALLER (.dmg)
  # Runs on a GitHub-hosted macOS machine
  # ===========================================================================
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Compile Java source
        run: javac src/NumGuessor.java -d out/

      - name: Create JAR
        run: jar cfe NumGuessor.jar NumGuessor -C out/ .

      - name: Extract version number
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build macOS .dmg
        run: |
          jpackage --input .
                   --main-jar NumGuessor.jar
                   --main-class NumGuessor
                   --name NumGuessor
                   --type dmg
                   --icon assets/icons/NumGuessor.icns
                   --app-version ${{ steps.version.outputs.VERSION }}
                   --vendor "0xb13"
                   --description "A number guessing game"
                   --copyright "Copyright 2026 0xb13"
                   --mac-package-name "NumGuessor"
                   --mac-package-identifier "com.0xb13.numguessor"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: NumGuessor-*.dmg


  # ===========================================================================
  # JOB 4 - CREATE GITHUB RELEASE
  # Waits for all three builds to finish, then attaches all installers
  # to the GitHub Release automatically
  # ===========================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]  # waits for all 3 jobs

    permissions:
      contents: write   # needed to create a release and upload assets

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Download all three installers built by the jobs above
      # -----------------------------------------------------------------------
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer

      # -----------------------------------------------------------------------
      # Create the release and attach all three installers in one step
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NumGuessor ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            NumGuessor-*.exe
            NumGuessor_*.deb
            NumGuessor-*.dmg